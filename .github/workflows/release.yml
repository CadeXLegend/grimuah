name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: grimuah-linux-x86_64
          - os: macos-latest
            artifact: grimuah-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - run: zig build -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: zig-out/bin/grimuah

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: sha256sum artifacts/*/grimuah > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*/grimuah
            checksums.txt
