name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
        build:
          - { optimize: ReleaseSafe, suffix: release-safe }
          - { optimize: ReleaseSmall, suffix: release-small }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # the asset name is a promise about the cpu it runs on, and `zig build`
      # takes its feature set from the machine running it: a runner with
      # avx-512 produced a linux-x86_64 binary carrying %zmm, which dies with
      # SIGILL on every cpu without it, most consumer chips since 2021 and all
      # of the amd ones. baseline is the feature set the name x86_64 promises,
      # and a local `zig build` keeps native features because it only ever runs
      # on the machine that built it
      - name: build
        run: |
          zig build -Doptimize=${{ matrix.build.optimize }} -Dcpu=baseline
          mkdir -p dist
          cp zig-out/bin/grimuah "dist/grimuah-${{ matrix.platform.name }}-${{ matrix.build.suffix }}"
      - uses: actions/upload-artifact@v7
        with:
          name: grimuah-${{ matrix.platform.name }}-${{ matrix.build.suffix }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: sha256sum artifacts/* > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*
            checksums.txt
