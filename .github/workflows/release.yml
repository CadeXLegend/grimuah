name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
        build:
          - { optimize: ReleaseSafe, suffix: release-safe }
          - { optimize: ReleaseSmall, suffix: release-small }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: build
        run: |
          zig build -Doptimize=${{ matrix.build.optimize }}
          mkdir -p dist
          cp zig-out/bin/grimuah "dist/grimuah-${{ matrix.platform.name }}-${{ matrix.build.suffix }}"
      - uses: actions/upload-artifact@v7
        with:
          name: grimuah-${{ matrix.platform.name }}-${{ matrix.build.suffix }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: sha256sum artifacts/* > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*
            checksums.txt
